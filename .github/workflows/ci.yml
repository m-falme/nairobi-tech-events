name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d events_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/events_ci
      ADMIN_SEED_PASSWORD: ci-only-admin-password
      AUTH_SECRET: ci-only-auth-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Prisma migrate deploy
        if: hashFiles('prisma/schema.prisma') != ''
        run: npx prisma migrate deploy
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=events_ci
          DATABASE_URL=postgresql://ci:ci-only-password@db:5432/events_ci
          ADMIN_SEED_EMAIL=admin@example.com
          ADMIN_SEED_PASSWORD=ci-only-admin-password
          AUTH_SECRET=ci-only-auth-secret-not-for-production
          EOF
      - name: Build image
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for home page (HTTP 200)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              curl -s --max-time 5 http://localhost:3000/ | grep -q "Nairobi Tech Events" && exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
