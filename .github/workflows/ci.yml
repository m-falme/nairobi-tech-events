name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d events_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/events_ci
      ADMIN_SEED_PASSWORD: ci-only-admin-password
      AUTH_SECRET: ci-only-auth-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Prisma migrate deploy
        if: hashFiles('prisma/schema.prisma') != ''
        run: npx prisma migrate deploy
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: events_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d events_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway values; not real secrets.
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/events_e2e
      ADMIN_SEED_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: ci-only-admin-password
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - run: npm run build
      - name: Playwright (chromium)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=events_ci
          DATABASE_URL=postgresql://ci:ci-only-password@db:5432/events_ci
          ADMIN_SEED_EMAIL=admin@example.com
          ADMIN_SEED_PASSWORD=ci-only-admin-password
          AUTH_SECRET=ci-only-auth-secret-not-for-production
          EOF
      - name: Build image
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for home page (HTTP 200)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              curl -s --max-time 5 http://localhost:3000/ | grep -q "Nairobi Tech Events" && exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
